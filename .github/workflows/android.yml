name: android-aab
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Drop signing (التوقيع يتم محلياً بمفتاح الرفع الخاص)
        run: sed -i '/signingConfig signingConfigs.release/d' android/app/build.gradle
      - name: Build unsigned AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon --console=plain
      - name: Build unsigned APK (للتثبيت المباشر)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: bilal-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: bilal-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: bilal-apk, path: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Sign with throwaway debug key
        run: |
          keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias d -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=dbg"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks dbg.jks --ks-pass pass:android --out apk/app.apk apk/app-release-unsigned.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/emu_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-out
          path: out/
